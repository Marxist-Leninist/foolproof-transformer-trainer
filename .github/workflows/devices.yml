name: Real Safari and phone simulator

# The main browser checks (site.yml) use the engines a test library can install on Linux. This workflow
# covers what those cannot:
#   - Safari itself, the one that ships with macOS, driven through Apple's safaridriver
#   - Safari on an iPhone, in Apple's simulator, running the site's own self-check page (docs/check.html)
# and it runs that self-check page in Chromium, Firefox and WebKit so the page itself is known to be sound.
# A simulator is not a phone in the hand: for that, open check.html on the phone.

on:
  push:
    paths: ["docs/**", "foolproof/web/**", "tests/web/**", ".github/workflows/devices.yml"]
  pull_request:
    paths: ["docs/**", "foolproof/web/**", "tests/web/**", ".github/workflows/devices.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-check-page:
    name: self-check page in Chromium, Firefox and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browsers
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium firefox webkit
      - name: The self-check page passes its own checks in each engine
        run: |
          python tests/web/device_check.py playwright chromium
          python tests/web/device_check.py playwright firefox
          python tests/web/device_check.py playwright webkit

  safari:
    name: Safari on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Which Mac and which Safari
        run: |
          sw_vers
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/Safari.app/Contents/Info.plist
      - name: Allow Safari to be driven
        run: |
          sudo safaridriver --enable
          defaults write com.apple.Safari AllowRemoteAutomation 1 || true
      - name: Install Selenium
        run: python -m pip install --upgrade pip selenium
      - name: Website in Safari (builder with and without a mouse, learning in the page)
        env:
          FP_SHOTS: ${{ runner.temp }}/shots
        run: python tests/web/safari_check.py
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 14

  iphone-simulator:
    name: Safari on an iPhone simulator
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devices = json.load(sys.stdin)['devices']
          found = []
          for runtime, items in devices.items():
              m = re.search(r'iOS-(\d+)-(\d+)', runtime)
              if not m:
                  continue
              for d in items:
                  if d['name'].startswith('iPhone') and d.get('isAvailable', True):
                      found.append(((int(m.group(1)), int(m.group(2)), 'Pro' not in d['name'], d['name']), d['udid'], d['name'], runtime))
          found.sort()
          print(found[-1][1])
          print(found[-1][2], found[-1][3], file=sys.stderr)
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: The self-check page in the simulator's Safari
        run: |
          python tests/web/device_check.py serve --port 8377 --timeout 600 --expect-wasm --out "$RUNNER_TEMP/iphone-report.json" &
          SERVER=$!
          sleep 3
          for attempt in 1 2 3; do
            xcrun simctl openurl "$UDID" "http://127.0.0.1:8377/check.html?auto=1&report=1" && break
            sleep 10
          done
          wait $SERVER
      - name: A picture of the simulator's screen
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/iphone-simulator.png" || true
          cp "$RUNNER_TEMP/iphone-report.json" "$RUNNER_TEMP/shots/" 2>/dev/null || true
      - name: Keep the picture and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-simulator
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 14
